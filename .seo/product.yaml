# Product definition. The ONLY source of truth for product claims in articles.
# A human must review this and set `reviewed: true` before articles can run.
name: "Nelio Carneiro's blog (nelio.me)"
one_liner: "Personal blog of Brazilian software engineer Nelio Carneiro, with hands-on, step-by-step React and frontend tutorials in Brazilian Portuguese, plus posts on SEO, entrepreneurship, his side projects and life off the screen."
audience: "Portuguese-speaking (mostly Brazilian) beginners in web development who want to learn React and the frontend tooling around it by building small examples step by step; secondarily, readers interested in the author's projects and personal essays."
url: "https://nelio.me"
pricing: "Free. Every post is free to read with no account; the site sells nothing (no courses, subscriptions, paid content or services) and shows no ads."
features_that_exist:
  - "Free blog posts, mostly in Brazilian Portuguese; the about page and a few posts (humble-modal, SuperFax, 'It's time to step away from your phone') are in English"
  - "Step-by-step React tutorials for beginners that build on each other: creating a first React app from a plain index.html, JSX, connecting components into a form (email, password, 'Enviar' button), and running it from a local server"
  - "Tutorial on setting up a local Express server with yarn to serve frontend/React files during development"
  - "Overview post on tools to start a React project: create-react-app, Vite, NextJS and Gatsby, with guidance on where to start"
  - "Post explaining React state variables: controlled vs uncontrolled components, setState in class components and the useState hook"
  - "Post showing how to persist state in the URL in a React app (a sortable list whose ?sort= query parameter is shareable), with the example code in the public GitHub repo neliojrr/blog-posts"
  - "Tutorials include full code listings with syntax highlighting and screenshots of the result in the browser or terminal"
  - "Older posts on programming and entrepreneurship (2010) and a hands-on SEO experiment with page titles and URLs (2013)"
  - "Personal essay on reducing smartphone use ('It's time to step away from your phone', 2024)"
  - "Projects page (/projetos/) listing the author's side projects: SuperFax, a Ruby on Rails web app for sending faxes over the internet (Phaxio, Stripe, Amazon S3), and humble-modal, an open-source React modal component on GitHub"
  - "About page (/sobre/) with the author's background: Computer Science degree from Universidade Federal de Goiás, work in hotel software, sales software at Martins, e-commerce at eFácil, frontend with ReactJS"
  - "Home page with author bio and a list of recent posts; archive page (/arquivo/) grouping all posts by year, with an instant search box that matches post titles and tags"
  - "Tags page (/tags/) grouping posts by tag"
  - "RSS feed at /feed.xml"
  - "Light and dark mode toggle that remembers the reader's choice in the browser"
  - "Disqus comments on posts that enable them, and a 'share on Twitter' link on recent posts"
features_that_do_not_exist:
  - "No paid products of any kind: no courses, ebooks, paid tiers, subscriptions, memberships or sponsorship packages"
  - "No consulting, mentoring, freelance or hiring services offered on the site; no services or contact form page (contact is only by email link and Twitter)"
  - "No newsletter or email signup"
  - "No reader accounts, login, bookmarks or progress tracking"
  - "No full-text search: the archive search matches only post titles and tags, not article content"
  - "No structured course, curriculum, certificate, exercises or quizzes; the React posts are standalone blog tutorials"
  - "No video, podcast or live content"
  - "No downloadable starter projects or companion repositories for most tutorials (only the URL-persistence post links its code)"
  - "No tutorials on TypeScript, Next.js in depth, Vue, Angular, React Native, testing, Redux or backend APIs; Vite, NextJS and Gatsby only appear in the tooling overview"
  - "No translations: posts are not available in both Portuguese and English, and there is no language switcher"
  - "No comments on every post (only where enabled) and no comment system other than Disqus"
  - "No claim that SuperFax or humble-modal are currently maintained or operating: the site only has project posts from 2014 and 2017"
  - "No pricing, plans or sign-up for SuperFax on this site; it is described, not sold here"
reviewed: false
